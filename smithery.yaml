# Smithery configuration for JUCESP: Download de Documento
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_documento

name: jucesp_documento-mcp
displayName: "JUCESP: Download de Documento"
description: >
  Baixa um documento arquivado de uma empresa na JUCESP a partir do NIRE e do número de registro. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_documento-mcp
repository: https://github.com/mcp-dir/jucesp_documento-mcp

tags:
  - jucesp_documento
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_documento

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_documento/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
